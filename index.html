<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수학 체스 (Math Chess)</title>
    <meta name="description" content="수학시간에 즐기는 대형 체스판 게임: AI 대전 및 1:1 대결, 참가자 이름 설정, 착수 사운드, 실시간 랭킹 시스템" />
    <meta property="og:title" content="수학 체스 (Math Chess)" />
    <meta property="og:description" content="수학시간에 즐기는 대형 체스판 게임: AI 대전 및 1:1 대결, 참가자 이름 설정, 착수 사운드, 실시간 랭킹 시스템" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Ensure trailing slash for GitHub Pages project sites to avoid relative URL resolution failures
      (function() {
        var p = window.location.pathname;
        if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
  <body style="margin: 0; padding: 0; background-color: #18181b; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <div id="root">
      <div id="app-loading-indicator" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #18181b; color: #f4f4f5; text-align: center; padding: 20px;">
        <div style="max-width: 360px;">
          <div style="font-size: 52px; margin-bottom: 16px; line-height: 1;">♟️</div>
          <h1 style="font-size: 19px; font-weight: 800; margin: 0 0 8px 0; letter-spacing: -0.02em;">수학 체스 (Math Chess)</h1>
          <p style="font-size: 13px; color: #a1a1aa; margin: 0 0 24px 0; line-height: 1.5;">대형 체스판과 랭킹 시스템을 준비 중입니다...</p>
          <div style="width: 36px; height: 36px; border: 3px solid #3f3f46; border-top-color: #f59e0b; border-radius: 50%; margin: 0 auto; animation: spinLoader 0.9s linear infinite;"></div>
          <style>@keyframes spinLoader { to { transform: rotate(360deg); } }</style>
        </div>
      </div>
    </div>
    <script>
      function reportGlobalError(msg) {
        console.error('Captured Global Error:', msg);
        var r = document.getElementById('root');
        if (r && (!r.querySelector('main') && !r.querySelector('header'))) {
          var isSourceMainTsx = String(msg || '').indexOf('src/main.tsx') !== -1;
          var guidance = isSourceMainTsx
            ? '<div style="background:#27272a;border-left:4px solid #f59e0b;padding:12px;margin:12px 0 16px;text-align:left;border-radius:4px;font-size:13px;line-height:1.6;color:#e4e4e7;">' +
              '<strong>💡 해결 방법 (GitHub Pages 설정 1단계):</strong><br/>' +
              'GitHub 저장소의 <strong>[Settings]</strong> &rarr; 좌측 <strong>[Pages]</strong> 메뉴에서<br/>' +
              '<strong>Build and deployment &gt; Source</strong>를<br/>' +
              '<span style="color:#f87171;text-decoration:line-through;">Deploy from a branch</span> 대신 <strong><span style="color:#34d399;">GitHub Actions</span></strong>로 변경해 주시면 빌드된 최신 체스 앱이 즉시 실행됩니다!' +
              '</div>'
            : '<p style="font-size:13px;color:#a1a1aa;margin:0 0 16px 0;line-height:1.5;">브라우저 자바스크립트 로딩 또는 저장소 캐시 충돌이 감지되었습니다.</p>';

          r.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#18181b;color:#f4f4f5;padding:24px;text-align:center;">' +
            '<div style="background:#27272a;border:1px solid #3f3f46;border-radius:18px;max-width:480px;width:100%;padding:28px;box-shadow:0 20px 40px rgba(0,0,0,0.6);">' +
            '<div style="font-size:36px;margin-bottom:12px;">♟️</div>' +
            '<h2 style="font-size:17px;font-weight:700;margin:0 0 8px 0;color:#fff;">체스 앱 배포 설정이 필요합니다</h2>' +
            guidance +
            '<div style="background:#18181b;color:#f87171;padding:12px;border-radius:10px;font-family:monospace;font-size:12px;word-break:break-all;text-align:left;margin-bottom:20px;border:1px solid #3f3f46;">' +
            String(msg || '알 수 없는 로딩 오류') + '</div>' +
            '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}location.reload();" style="background:#d97706;color:#fff;border:none;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;">' +
            '새로고침</button>' +
            '</div></div>';
        }
      }

      // Capture runtime script errors and network loading failures (capture phase = true)
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var src = e.target.src || e.target.href || '';
          reportGlobalError('파일 로딩 실패 (404/네트워크 오류): ' + src);
        } else {
          reportGlobalError(e.message || (e.error && e.error.message) || 'Script execution error');
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        reportGlobalError(e.reason && e.reason.message ? e.reason.message : 'Promise rejection error');
      });

      // Watchdog: If loading indicator remains after 7s, show helper
      setTimeout(function() {
        var indicator = document.getElementById('app-loading-indicator');
        if (indicator) {
          reportGlobalError('스크립트 응답 지연: 브라우저 캐시를 새로고침하거나 아래 버튼을 클릭해 주세요.');
        }
      }, 7000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
